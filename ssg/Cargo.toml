[package]
name = "ssg"
version = "0.1.0"
edition = "2021"
description = "A blazing fast static site generator"
authors = ["Your Name"]
license = "MIT"

[dependencies]
rushdown = "0.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
rayon = "1.12.0"
tera = "1"
memmap2 = "0.9.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
notify = "6.1"
walkdir = "2.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1