<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | {{ site.title }}</title>
    <meta name="description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
    {% if og_image %}
    <meta property="og:image" content="{{ site.base_url }}{{ og_image }}">
    {% endif %}
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{% if description %}{{ description }}{% else %}{{ site.description }}{% endif %}">
    <meta property="og:type" content="website">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title }} RSS Feed" href="{{ site.base_url }}/feed.xml">
    <link rel="stylesheet" href="/style.css">
    <script>
        // Live reload WebSocket
        (function() {
            try {
                const ws = new WebSocket('ws://localhost:8081');
                ws.onmessage = function(event) {
                    if (event.data === 'reload') {
                        location.reload();
                    }
                };
                ws.onclose = function() {
                    setTimeout(function() {
                        try {
                            new WebSocket('ws://localhost:8081');
                        } catch(e) {}
                    }, 1000);
                };
            } catch(e) {}
        })();
    </script>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <nav class="main-nav">
                <a href="/" class="site-logo">{{ site.title }}</a>
                <ul class="nav-links">
                    <li><a href="/posts/">Blog</a></li>
                    <li><a href="/projects/">Projects</a></li>
                </ul>
            </nav>
        </header>

        <main class="site-main">
            {% block content %}{% endblock %}
        </main>

        <footer class="site-footer">
            <div class="footer-content">
                <p>&copy; 2026 {{ site.title }}. All rights reserved.</p>
                <div class="footer-links">
                    <a href="/feed.xml">RSS</a>
                    <a href="/sitemap.xml">Sitemap</a>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
