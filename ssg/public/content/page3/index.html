    <script>
        // Live reload WebSocket
        (function() {
            try {
                const ws = new WebSocket('ws://localhost:8081');
                ws.onmessage = function(event) {
                    if (event.data === 'reload') {
                        location.reload();
                    }
                };
                ws.onclose = function() {
                    setTimeout(function() {
                        try {
                            new WebSocket('ws://localhost:8081');
                        } catch(e) {}
                    }, 1000);
                };
            } catch(e) {}
        })();
    </script>
