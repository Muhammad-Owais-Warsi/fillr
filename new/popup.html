<!doctype html>
<html>
    <head>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                width: 380px;
                font-family: "IBM Plex Sans", sans-serif;
                background: #ffffff;
                color: #111;
            }

            /* ── HEADER ── */
            .header {
                padding: 14px 16px;
                border-bottom: 1px solid #d0d0d0;
                display: flex;
                justify-content: space-between;
                align-items: baseline;
            }

            .header-title {
                font-size: 13px;
                font-weight: 500;
                letter-spacing: 0.01em;
            }

            .header-hint {
                font-family: "IBM Plex Mono", monospace;
                font-size: 10px;
                color: #aaa;
                letter-spacing: 0.1em;
            }

            /* ── FORM ── */
            .form-section {
                padding: 14px 16px;
                border-bottom: 1px solid #d0d0d0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .field-label {
                font-family: "IBM Plex Mono", monospace;
                font-size: 10px;
                color: #aaa;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .field-row {
                display: flex;
            }

            input {
                border: 1px solid #d0d0d0;
                padding: 8px 10px;
                font-family: "IBM Plex Mono", monospace;
                font-size: 12px;
                color: #111;
                background: #fff;
                outline: none;
                transition: border-color 0.1s;
            }

            input:focus {
                border-color: #111;
                z-index: 1;
                position: relative;
            }

            input#key {
                width: 100px;
                border-right: none;
                flex-shrink: 0;
            }

            input#val {
                flex: 1;
                border-right: none;
            }

            #saveBtn {
                background: #111;
                color: #fff;
                border: 1px solid #111;
                padding: 8px 16px;
                font-family: "IBM Plex Mono", monospace;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.08em;
                cursor: pointer;
                flex-shrink: 0;
                white-space: nowrap;
            }

            #saveBtn:hover {
                background: #333;
                border-color: #333;
            }

            /* ── LIST HEADER ── */
            .list-header {
                padding: 10px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid #ebebeb;
            }

            .list-header-label {
                font-family: "IBM Plex Mono", monospace;
                font-size: 10px;
                color: #aaa;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            #snippet-count {
                font-family: "IBM Plex Mono", monospace;
                font-size: 10px;
                color: #ccc;
                letter-spacing: 0.06em;
            }

            /* ── SNIPPET LIST ── */
            #snippetList {
                max-height: 320px;
                overflow-y: auto;
            }

            #snippetList::-webkit-scrollbar {
                width: 3px;
            }

            #snippetList::-webkit-scrollbar-track {
                background: transparent;
            }

            #snippetList::-webkit-scrollbar-thumb {
                background: #ddd;
            }

            .snippet-item {
                display: flex;
                align-items: stretch;
                border-bottom: 1px solid #ebebeb;
                min-height: 48px;
            }

            .snippet-item:last-child {
                border-bottom: none;
            }

            .snippet-item:hover {
                background: #fafafa;
            }

            .snippet-key {
                font-family: "IBM Plex Mono", monospace;
                font-size: 12px;
                font-weight: 500;
                color: #111;
                padding: 14px 14px;
                width: 100px;
                flex-shrink: 0;
                border-right: 1px solid #ebebeb;
                display: flex;
                align-items: center;
            }

            .snippet-val {
                font-family: "IBM Plex Mono", monospace;
                font-size: 11px;
                color: #888;
                padding: 14px 12px;
                flex: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: flex;
                align-items: center;
            }

            /* ── ROW ACTIONS ── */
            .actions {
                display: flex;
                align-items: stretch;
                border-left: 1px solid #ebebeb;
                flex-shrink: 0;
            }

            .btn-edit,
            .btn-del {
                font-family: "IBM Plex Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.06em;
                background: none;
                border: none;
                border-right: 1px solid #ebebeb;
                padding: 0 13px;
                cursor: pointer;
                color: #bbb;
                display: flex;
                align-items: center;
            }

            .btn-del {
                border-right: none;
                color: #dba8a8;
            }

            .btn-edit:hover {
                color: #111;
                background: #f2f2f2;
            }

            .btn-del:hover {
                background: #fff5f5;
                color: #c0392b;
            }

            /* ── EMPTY STATE ── */
            .empty-state {
                padding: 40px 16px;
                text-align: center;
                color: #ccc;
                font-family: "IBM Plex Mono", monospace;
                font-size: 11px;
                letter-spacing: 0.06em;
            }

            /* ── FOOTER ── */
            .footer {
                padding: 10px 16px;
                border-top: 1px solid #d0d0d0;
                display: flex;
                gap: 8px;
            }

            #importBtn,
            #exportBtn {
                flex: 1;
                background: #fff;
                color: #111;
                border: 1px solid #d0d0d0;
                padding: 7px 0;
                font-family: "IBM Plex Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.08em;
                cursor: pointer;
            }

            #importBtn:hover,
            #exportBtn:hover {
                border-color: #111;
                background: #fafafa;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <span class="header-title">Snippets</span>
            <span class="header-hint">CTRL + ; TO TRIGGER</span>
        </div>

        <div class="form-section">
            <div class="field-label">New snippet</div>
            <div class="field-row">
                <input
                    type="text"
                    id="key"
                    placeholder="key"
                    autocomplete="off"
                />
                <input
                    type="text"
                    id="val"
                    placeholder="value to insert"
                    autocomplete="off"
                />
                <button id="saveBtn">ADD</button>
            </div>
        </div>

        <div class="list-header">
            <span class="list-header-label">Saved</span>
            <span id="snippet-count"></span>
        </div>

        <div id="snippetList"></div>

        <div class="footer">
            <button id="exportBtn">EXPORT</button>
            <button id="importBtn">IMPORT</button>
            <input
                type="file"
                id="importFile"
                accept=".json,application/json"
                hidden
            />
        </div>

        <script src="popup.js"></script>
    </body>
</html>
